<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E6D0"/>
      <stop offset="50%" stop-color="#EFD9B0"/>
      <stop offset="100%" stop-color="#E8C878"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- Lotus flower -->
  <g transform="translate(256,200)">
    <ellipse cx="0" cy="-40" rx="18" ry="45" fill="#D4A843" opacity="0.6" transform="rotate(-30)"/>
    <ellipse cx="0" cy="-40" rx="18" ry="45" fill="#D4A843" opacity="0.6" transform="rotate(30)"/>
    <ellipse cx="-28" cy="-28" rx="15" ry="38" fill="#C4952F" opacity="0.5" transform="rotate(-58)"/>
    <ellipse cx="28" cy="-28" rx="15" ry="38" fill="#C4952F" opacity="0.5" transform="rotate(58)"/>
    <ellipse cx="0" cy="-35" rx="12" ry="35" fill="#F8EDD8" opacity="0.85" transform="rotate(-15)"/>
    <ellipse cx="0" cy="-35" rx="12" ry="35" fill="#F8EDD8" opacity="0.85" transform="rotate(15)"/>
    <ellipse cx="-14" cy="-26" rx="10" ry="28" fill="#FAF2E4" opacity="0.7" transform="rotate(-45)"/>
    <ellipse cx="14" cy="-26" rx="10" ry="28" fill="#FAF2E4" opacity="0.7" transform="rotate(45)"/>
    <circle cx="0" cy="-20" r="6" fill="#D4A843"/>
    <circle cx="0" cy="-20" r="3" fill="#E8C878"/>
  </g>
  <!-- Koi fish 1 -->
  <g transform="translate(220,340)">
    <path d="M-65,0 Q-30,-16 0,0 Q30,16 65,0 Q30,-6 0,-3 Q-30,-6 -65,0Z" fill="#FFFFFF" opacity="0.9" stroke="#D4A843" stroke-width="1.2"/>
    <circle cx="-48" cy="-2" r="2.5" fill="#D4A843"/>
    <path d="M-65,0 Q-82,-14 -76,0 Q-82,14 -65,0Z" fill="#FFFFFF" opacity="0.7" stroke="#D4A843" stroke-width="0.8"/>
    <path d="M0,-3 Q8,-8 12,-3" fill="none" stroke="#D4A843" stroke-width="0.5" opacity="0.5"/>
  </g>
  <!-- Koi fish 2 -->
  <g transform="translate(310,365)">
    <path d="M-45,0 Q-22,-11 0,0 Q22,11 45,0 Q22,-4 0,-2 Q-22,-4 -45,0Z" fill="#FFFFFF" opacity="0.85" stroke="#D4A843" stroke-width="1"/>
    <circle cx="-32" cy="-1" r="2" fill="#D4A843"/>
    <path d="M-45,0 Q-58,-9 -54,0 Q-58,9 -45,0Z" fill="#FFFFFF" opacity="0.6" stroke="#D4A843" stroke-width="0.6"/>
  </g>
  <!-- Water ripples -->
  <ellipse cx="256" cy="378" rx="90" ry="14" fill="none" stroke="#87CEEB" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="256" cy="384" rx="110" ry="16" fill="none" stroke="#87CEEB" stroke-width="0.5" opacity="0.25"/>
  <!-- Sparkles -->
  <circle cx="170" cy="110" r="2.5" fill="#D4A843" opacity="0.5"/>
  <circle cx="350" cy="140" r="2" fill="#D4A843" opacity="0.4"/>
  <circle cx="300" cy="95" r="1.5" fill="#D4A843" opacity="0.55"/>
  <circle cx="200" cy="155" r="2" fill="#D4A843" opacity="0.35"/>
  <circle cx="380" cy="180" r="1" fill="#D4A843" opacity="0.3"/>
  <!-- Golden light rays -->
  <line x1="256" y1="200" x2="130" y2="80" stroke="#D4A843" stroke-width="0.5" opacity="0.15"/>
  <line x1="256" y1="200" x2="380" y2="80" stroke="#D4A843" stroke-width="0.5" opacity="0.15"/>
  <line x1="256" y1="200" x2="256" y2="60" stroke="#D4A843" stroke-width="0.5" opacity="0.15"/>
