# ChiGlow — Codemagic CI/CD Configuration
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# SETUP REQUIRED (once Apple Developer account is active):
# 1. Connect Codemagic to GitHub: https://codemagic.io
# 2. Add Apple Developer credentials in Codemagic → Teams → Integrations
# 3. Register bundle ID "com.chiglow.app" in App Store Connect
# 4. Push a tag like "v1.0.0-beta1" to trigger the release workflow

workflows:
  # ── iOS TestFlight Build ──────────────────────────────────────
  ios-build:
    name: iOS Build (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      groups:
        - app_store_credentials   # Create this in Codemagic → Teams → Environment Variables
      vars:
        BUNDLE_ID: com.chiglow.app
        APP_STORE_CONNECT_ISSUER_ID: encrypted(...)
        APP_STORE_CONNECT_KEY_ID: encrypted(...)
        APP_STORE_CONNECT_PRIVATE_KEY: encrypted(...)
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Generate app icons
        script: flutter pub run flutter_launcher_icons
      - name: Run tests
        script: flutter test || echo "No tests yet — skipping"
      - name: Build iOS
        script: |
          flutter build ipa --release \
            --export-options-plist /tmp/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        apple_id: encrypted(...)   # Set in Codemagic env vars
      email:
        recipients:
          - support@chiglow.app
        notify:
          success: true
          failure: true

  # ── Android Internal Testing Build ───────────────────────────
  android-build:
    name: Android Build (AAB for Play Store)
    instance_type: linux
    max_build_duration: 20
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: com.chiglow.app
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Generate app icons
        script: flutter pub run flutter_launcher_icons
      - name: Run tests
        script: flutter test || echo "No tests yet — skipping"
      - name: Build Android App Bundle
        script: flutter build appbundle --release
      - name: Build APK (for direct testing)
        script: flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    publishing:
      email:
        recipients:
          - support@chiglow.app
        notify:
          success: true
          failure: true

  # ── Release Workflow (runs on version tags) ──────────────────
  release:
    name: Release Build (App Store + Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      flutter: stable
      xcode: latest
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: com.chiglow.app
        PACKAGE_NAME: com.chiglow.app
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Generate app icons
        script: flutter pub run flutter_launcher_icons
      - name: Build iOS IPA
        script: flutter build ipa --release
      - name: Build Android AAB
        script: flutter build appbundle --release
    artifacts:
      - build/ios/ipa/*.ipa
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      app_store_connect:
        apple_id: encrypted(...)
      google_play:
        credentials: encrypted(...)
        track: internal
      email:
        recipients:
          - support@chiglow.app
